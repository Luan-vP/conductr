[workspace]
resolver = "2"
members = [
    "crates/conductr",
    "crates/conductr-core",
    "crates/conductr-adapters",
    "crates/conductr-orchestrate",
    "crates/conductr-instance",
    "crates/conductr-pod",
    "crates/conductr-schedule",
    "crates/conductr-tasks",
    "crates/conductr-setup",
    "crates/conductr-mail",
    "crates/conductr-calendar",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Luan-vP/conductr"
authors = ["Luan van Pletsen"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
async-trait = "0.1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
toml = "0.8"

conductr-core        = { path = "crates/conductr-core",        version = "0.1.0" }
conductr-adapters    = { path = "crates/conductr-adapters",    version = "0.1.0" }
conductr-orchestrate = { path = "crates/conductr-orchestrate", version = "0.1.0" }
conductr-instance    = { path = "crates/conductr-instance",    version = "0.1.0" }
conductr-pod         = { path = "crates/conductr-pod",         version = "0.1.0" }
conductr-schedule    = { path = "crates/conductr-schedule",    version = "0.1.0" }
conductr-tasks       = { path = "crates/conductr-tasks",       version = "0.1.0" }
conductr-setup       = { path = "crates/conductr-setup",       version = "0.1.0" }
conductr-mail        = { path = "crates/conductr-mail",        version = "0.1.0" }
conductr-calendar    = { path = "crates/conductr-calendar",    version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
