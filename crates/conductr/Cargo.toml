[package]
name = "conductr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scheduling and orchestration for agents and people"

[[bin]]
name = "conductr"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

conductr-core        = { workspace = true }
conductr-adapters    = { workspace = true, features = ["mock"] }
conductr-orchestrate = { workspace = true }
conductr-instance    = { workspace = true }
conductr-pod         = { workspace = true }
conductr-schedule    = { workspace = true }
conductr-tasks       = { workspace = true }
conductr-setup       = { workspace = true }
conductr-mail        = { workspace = true }
conductr-adapters    = { workspace = true, features = ["mail-fs"] }
serde                = { workspace = true }
chrono               = { workspace = true }
