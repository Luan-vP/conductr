[package]
name = "conductr-dashboard-daemon"
description = "Read-only Unix-socket state aggregator for the conductr dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "conductr-daemon"
path = "src/bin/conductr-daemon.rs"

[dependencies]
conductr-dashboard-core = { path = "../conductr-dashboard-core", version = "0.1.0" }
conductr-core    = { workspace = true }
conductr-adapters = { workspace = true, features = ["tmux", "crontab"] }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
chrono           = { workspace = true }
futures          = { workspace = true }
async-trait      = { workspace = true }
clap             = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
