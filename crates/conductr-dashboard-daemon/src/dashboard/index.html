<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>conductr</title>
<style>
/* ── theme ───────────────────────────────────────────────────────── */
:root {
  --clr:  #00ff41;
  --dim:  #004d18;
  --bg:   #070a07;
  --bg1:  #0c110c;
  --bg2:  #111711;
  --red:  #ff2244;
  --font: 'Courier New', Courier, monospace;
}

/* ── reset ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--clr);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── scrollbar ───────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

/* ── header ──────────────────────────────────────────────────────── */
#hdr {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-bottom: 1px solid var(--dim);
  flex-shrink: 0;
  background: var(--bg1);
}
.logo {
  letter-spacing: 4px;
  font-size: 14px;
  text-transform: lowercase;
}
#dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dim);
  transition: background .4s, box-shadow .4s;
  flex-shrink: 0;
}
#dot.live { background: var(--clr); box-shadow: 0 0 7px var(--clr); }
#host { font-size: 11px; opacity: .5; }
.spacer { flex: 1; }
#back-btn {
  display: none;
  cursor: pointer;
  font-size: 11px;
  opacity: .55;
  letter-spacing: 1px;
  padding: 2px 6px;
  border: 1px solid var(--dim);
}
#back-btn:hover { opacity: 1; border-color: var(--clr); }
#clr-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  opacity: .55;
  letter-spacing: 1px;
}
#clr-pick {
  width: 20px; height: 20px;
  border: 1px solid var(--dim);
  background: none;
  padding: 1px;
  cursor: pointer;
  border-radius: 2px;
}
#err-banner {
  display: none;
  padding: 5px 16px;
  font-size: 11px;
  color: var(--red);
  border-bottom: 1px solid var(--red);
  background: rgba(255,34,68,.05);
  flex-shrink: 0;
}

/* ── main ────────────────────────────────────────────────────────── */
#main {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 24px;
}

/* ── section header ──────────────────────────────────────────────── */
.sec {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: .4;
  margin: 18px 0 5px;
}
.sec:first-child { margin-top: 2px; }
.rule { border: none; border-top: 1px solid var(--dim); margin-bottom: 8px; }

/* ── repo card ───────────────────────────────────────────────────── */
.repo-card {
  border: 1px solid var(--dim);
  padding: 10px 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .15s;
}
.repo-card:hover { border-color: var(--clr); }
.card-hdr {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 5px;
}
.card-slug { font-size: 13px; }
.card-mat  { font-size: 10px; opacity: .45; }
.card-st   { margin-left: auto; font-size: 11px; }
.card-st.running { animation: pulse 1.2s ease-in-out infinite alternate; }
.card-st.idle    { opacity: .45; }
.card-st.failed  { color: var(--red); }

.card-staff { height: 82px; position: relative; }
.card-staff svg { display: block; }

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 10px;
  opacity: .5;
  margin-top: 5px;
}

/* ── empty / error ───────────────────────────────────────────────── */
.empty {
  opacity: .35;
  font-size: 11px;
  font-style: italic;
  padding: 2px 0;
}

/* ── detail view ─────────────────────────────────────────────────── */
#detail { display: none; }
.detail-title { font-size: 15px; letter-spacing: 1px; margin-bottom: 2px; }
.detail-sub   { font-size: 10px; opacity: .45; margin-bottom: 2px; }

.staff-wrap { min-height: 60px; margin-bottom: 4px; }
.staff-wrap svg { display: block; overflow: visible; }

/* ── beats ───────────────────────────────────────────────────────── */
.beat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.beat-table td { padding: 2px 6px 2px 0; vertical-align: middle; }
.beat-name  { width: 110px; opacity: .75; }
.beat-glyph { width: 20px; font-size: 14px; }
.beat-state { width: 80px; }
.beat-state.running { animation: pulse 1.2s ease-in-out infinite alternate; }
.beat-state.queued  { opacity: .4; }
.beat-state.failed  { color: var(--red); }
.beat-state.skipped { opacity: .3; }
.beat-time  { opacity: .4; font-size: 10px; }

/* ── pr list ─────────────────────────────────────────────────────── */
.pr-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-size: 12px; }
.pr-num   { width: 36px; opacity: .5; flex-shrink: 0; }
.pr-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-ci    { font-size: 10px; flex-shrink: 0; }
.pr-ci.green { color: var(--clr); }
.pr-ci.red   { color: var(--red); }
.pr-ci.draft { opacity: .4; }

/* ── findings ────────────────────────────────────────────────────── */
.finding-row { display: flex; gap: 8px; padding: 2px 0; font-size: 12px; }
.finding-sev   { width: 80px; flex-shrink: 0; opacity: .6; font-size: 10px; }
.finding-title { flex: 1; }
.finding-issue { opacity: .45; font-size: 10px; flex-shrink: 0; }

/* ── pod ─────────────────────────────────────────────────────────── */
.pod-row { padding: 5px 0; border-bottom: 1px solid var(--dim); }
.pod-row:last-child { border-bottom: none; }
.pod-hdr { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.pod-name { flex: 1; }
.pod-tail { font-size: 10px; opacity: .4; margin-top: 3px; max-height: 36px; overflow: hidden; }

/* ── cron ────────────────────────────────────────────────────────── */
.cron-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-size: 12px; }
.cron-expr { width: 130px; flex-shrink: 0; opacity: .8; }
.cron-cmd  { flex: 1; opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cron-next { font-size: 10px; opacity: .45; flex-shrink: 0; }

/* ── agents ──────────────────────────────────────────────────────── */
.agent-row { display: flex; gap: 8px; align-items: center; padding: 2px 0; font-size: 12px; }
.agent-kind   { width: 60px; flex-shrink: 0; }
.agent-url    { width: 200px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .6; }
.agent-lat    { width: 50px; flex-shrink: 0; font-size: 10px; opacity: .6; }
.agent-models { flex: 1; font-size: 10px; opacity: .4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── animations ──────────────────────────────────────────────────── */
@keyframes pulse { from { opacity: .5 } to { opacity: 1 } }
</style>
</head>
<body>

<header id="hdr">
  <span class="logo">conductr</span>
  <div id="dot"></div>
  <span id="host">connecting…</span>
  <div class="spacer"></div>
  <span id="back-btn" onclick="showOverview()">← overview</span>
  <div id="clr-wrap">
    <span>color</span>
    <input type="color" id="clr-pick" value="#00ff41">
  </div>
</header>

<div id="err-banner"></div>

<main id="main">
  <div id="overview"></div>
  <div id="detail"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<script>
'use strict';

// ── globals ─────────────────────────────────────────────────────────────────
let G = {
  state: null,       // full DashboardState from /state
  view: 'overview',  // 'overview' | 'detail'
  slug: null,        // selected "owner/repo"
  color: '#00ff41',
  es: null,          // EventSource
};

// ── boot ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const pick = document.getElementById('clr-pick');
  pick.value = G.color;
  pick.addEventListener('input', e => applyColor(e.target.value));
  connect();
});

// ── color ────────────────────────────────────────────────────────────────────
function applyColor(c) {
  G.color = c;
  const r = parseInt(c.slice(1,3),16);
  const g = parseInt(c.slice(3,5),16);
  const b = parseInt(c.slice(5,7),16);
  const dim = `rgb(${Math.round(r*.22)},${Math.round(g*.22)},${Math.round(b*.22)})`;
  document.documentElement.style.setProperty('--clr', c);
  document.documentElement.style.setProperty('--dim', dim);
  if (G.state) render();
}

// ── connect ───────────────────────────────────────────────────────────────────
async function connect() {
  setErr(null);
  try {
    const res = await fetch('/state');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const env = await res.json();
    G.state = env.data;
    document.getElementById('host').textContent = env.host || 'localhost';
    document.getElementById('dot').classList.add('live');
    render();
    subscribe();
  } catch(e) {
    document.getElementById('host').textContent = 'disconnected';
    document.getElementById('dot').classList.remove('live');
    setErr('daemon unreachable — retrying…');
    setTimeout(connect, 4000);
  }
}

function subscribe() {
  if (G.es) G.es.close();
  G.es = new EventSource('/events');
  G.es.onerror = () => {
    document.getElementById('dot').classList.remove('live');
    G.es.close();
    setErr('event stream lost — reconnecting…');
    setTimeout(connect, 3000);
  };
  G.es.onopen = () => {
    document.getElementById('dot').classList.add('live');
    setErr(null);
  };

  const refetch = () => connect();  // simple: re-fetch full state on any event
  ['pr.opened','pr.changed','pr.closed','pr.merged',
   'cycle.started','cycle.finished',
   'pod.session_changed','pod.session_crashed',
   'finding.new','finding.resolved',
   'local_agent.changed','cadence.tick',
   'daemon.stale','daemon.unstale']
    .forEach(t => G.es.addEventListener(t, refetch));
}

function setErr(msg) {
  const b = document.getElementById('err-banner');
  if (msg) { b.textContent = msg; b.style.display = ''; }
  else      { b.style.display = 'none'; }
}

// ── navigation ────────────────────────────────────────────────────────────────
function showOverview() {
  G.view = 'overview'; G.slug = null;
  render();
}
function showDetail(slug) {
  G.view = 'detail'; G.slug = slug;
  render();
}

// ── main render ───────────────────────────────────────────────────────────────
function render() {
  document.getElementById('overview').style.display = G.view === 'overview' ? '' : 'none';
  document.getElementById('detail').style.display   = G.view === 'detail'   ? '' : 'none';
  document.getElementById('back-btn').style.display = G.view === 'detail'   ? '' : 'none';

  if (G.view === 'detail') renderDetail(G.slug);
  else                     renderOverview();
}

// ── overview ──────────────────────────────────────────────────────────────────
function renderOverview() {
  const ov = document.getElementById('overview');
  const repos = (G.state && G.state.repos) || [];
  if (!repos.length) {
    ov.innerHTML = '<div class="empty">no repos registered</div>';
    return;
  }

  ov.innerHTML = repos.map(r => {
    const slug    = `${r.slug.owner}/${r.slug.repo}`;
    const safeid  = slug.replace(/\//g,'-').replace(/[^a-z0-9-]/gi,'');
    const cycle   = findCycle(slug);
    const prs     = findPrs(slug);
    const findings= findFindings(slug);

    const stClass = cycle ? (cycle.state === 'running' ? 'running' : cycle.state === 'failed' ? 'failed' : 'idle') : 'idle';
    const stLabel = cycle ? `● ${cycle.state}` : '○ idle';
    const prTotal = prs ? prs.mergeable_green.length + prs.mergeable_red.length + prs.conflicting.length + prs.draft.length : 0;
    const mat     = r.maturity || '';
    const crons   = r.cadence  ? Object.entries(r.cadence).map(([k,v]) => `${k} ${v}`).join(' · ') : '';

    return `
<div class="repo-card" onclick="showDetail('${slug}')">
  <div class="card-hdr">
    <span class="card-slug">${esc(slug)}</span>
    ${mat ? `<span class="card-mat">${esc(mat)}</span>` : ''}
    <span class="card-st ${stClass}">${stLabel}</span>
  </div>
  <div class="card-staff" id="cs-${safeid}">
    <div class="empty" style="padding:28px 0;text-align:center;font-size:10px">loading…</div>
  </div>
  <div class="card-meta">
    ${prTotal > 0 ? `<span>■ ${prTotal} PR${prTotal!==1?'s':''}</span>` : ''}
    ${findings.length > 0 ? `<span>▲ ${findings.length} finding${findings.length!==1?'s':''}</span>` : ''}
    ${crons ? `<span>${esc(crons)}</span>` : ''}
  </div>
</div>`;
  }).join('');

  // Defer VexFlow rendering until after layout so clientWidth is set
  requestAnimationFrame(() => {
    repos.forEach(r => {
      const slug   = `${r.slug.owner}/${r.slug.repo}`;
      const safeid = slug.replace(/\//g,'-').replace(/[^a-z0-9-]/gi,'');
      const cycle  = findCycle(slug);
      renderCycleStaff(`cs-${safeid}`, cycle, true);
    });
  });
}

// ── detail ────────────────────────────────────────────────────────────────────
function renderDetail(slug) {
  const [owner, repo] = slug.split('/');
  const r        = G.state.repos.find(r => r.slug.owner===owner && r.slug.repo===repo);
  const cycle    = findCycle(slug);
  const prs      = findPrs(slug);
  const findings = findFindings(slug);
  const sessions = (G.state.pod && G.state.pod.sessions) || [];
  const cron     = G.state.cron || [];
  const agents   = G.state.local_agents || [];

  const el = document.getElementById('detail');
  el.innerHTML = `
<div class="detail-title">${esc(slug)}</div>
<div class="detail-sub">${r ? esc((r.maturity||'')+(r.local_path?' · '+r.local_path:'')) : ''}</div>

<div class="sec">cadence</div><hr class="rule">
<div class="staff-wrap" id="cadence-wrap" style="min-height:${cadenceHeight(0)}px">
  <div class="empty" style="padding:16px 0">fetching cadence…</div>
</div>

${cycle ? `
<div class="sec">cycle · ${esc(cycle.trigger)} · ${esc(cycle.state)}</div><hr class="rule">
<div class="staff-wrap" id="cycle-wrap" style="min-height:82px"></div>
${renderBeatTable(cycle.beats)}
` : ''}

<div class="sec">pull requests</div><hr class="rule">
${renderPrs(prs)}

<div class="sec">findings</div><hr class="rule">
${renderFindings(findings)}

<div class="sec">pod sessions</div><hr class="rule">
${renderPod(sessions)}

<div class="sec">cron</div><hr class="rule">
${renderCron(cron)}

<div class="sec">local agents</div><hr class="rule">
${renderAgents(agents)}
`;

  // Render cycle staff
  if (cycle) renderCycleStaff('cycle-wrap', cycle, false);

  // Fetch cadence data
  fetch(`/repos/${owner}/${repo}/cadence`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(env => {
      const cadence = env.data;
      const wrap = document.getElementById('cadence-wrap');
      if (!wrap) return;
      wrap.style.minHeight = cadenceHeight(cadence.rows.length) + 'px';
      renderCadenceStaff('cadence-wrap', cadence);
    })
    .catch(() => {
      const wrap = document.getElementById('cadence-wrap');
      if (wrap) wrap.innerHTML = '<div class="empty">no cadence data</div>';
    });
}

function cadenceHeight(rows) { return Math.max(60, rows * 75 + 20); }

// ── VexFlow: cycle beats ──────────────────────────────────────────────────────
function renderCycleStaff(containerId, cycle, compact) {
  const el = document.getElementById(containerId);
  if (!el) return;

  if (!cycle || !cycle.beats || !cycle.beats.length) {
    el.innerHTML = `<div class="empty" style="text-align:center;padding:${compact?'28':'16'}px 0;font-size:10px">no cycle data</div>`;
    return;
  }

  el.innerHTML = '';
  try {
    const VF   = Vex.Flow;
    const w    = el.clientWidth || 500;
    const h    = compact ? 82 : 100;
    const clr  = G.color;

    const renderer = new VF.Renderer(el, VF.Renderer.Backends.SVG);
    renderer.resize(w, h);
    const ctx = renderer.getContext();
    ctx.setFillStyle(clr);
    ctx.setStrokeStyle(clr);

    const staveY = compact ? 8 : 12;
    const stave  = new VF.Stave(8, staveY, w - 16);
    stave.setContext(ctx).draw();

    const beats = cycle.beats.slice(0, 8);
    const notes = beats.map(b => makeCycleNote(VF, b, clr));

    // Give the voice ample beats; setStrict(false) means no exact-fill enforcement
    const numBeats = Math.max(4, beats.length * 2);
    const voice = new VF.Voice({ num_beats: numBeats, beat_value: 4 });
    voice.setStrict(false);
    voice.addTickables(notes);

    new VF.Formatter().joinVoices([voice]).format([voice], w - 60);
    voice.draw(ctx, stave);

    // Beat name annotations below stave
    if (!compact) {
      const svg = el.querySelector('svg');
      if (svg && beats.length) {
        const notePosX = getNotePosX(svg, notes.length);
        beats.forEach((b, i) => {
          if (notePosX[i] == null) return;
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', notePosX[i]);
          t.setAttribute('y', staveY + 72);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('fill', clr);
          t.setAttribute('font-size', '9');
          t.setAttribute('font-family', 'Courier New, monospace');
          t.textContent = b.name;
          svg.appendChild(t);
        });
      }
    }

    colorizeVF(el, clr);
  } catch(e) {
    console.warn('VexFlow cycle render:', e);
    el.innerHTML = `<div class="empty" style="text-align:center;padding:28px 0;font-size:10px">notation unavailable</div>`;
  }
}

function makeCycleNote(VF, beat, clr) {
  const key = 'b/4';
  switch (beat.state) {
    case 'done':
      return new VF.StaveNote({ clef: 'treble', keys: [key], duration: 'q' });
    case 'running': {
      // Half note = open notehead = in progress
      const n = new VF.StaveNote({ clef: 'treble', keys: [key], duration: 'h' });
      return n;
    }
    case 'failed': {
      const n = new VF.StaveNote({ clef: 'treble', keys: [key], duration: 'q' });
      n.setStyle({ fillStyle: '#ff2244', strokeStyle: '#ff2244' });
      return n;
    }
    case 'skipped':
      return new VF.StaveNote({ clef: 'treble', keys: [key], duration: 'hr' });
    case 'queued':
    default:
      return new VF.StaveNote({ clef: 'treble', keys: [key], duration: 'qr' });
  }
}

// ── VexFlow: cadence staff ────────────────────────────────────────────────────
function renderCadenceStaff(containerId, cadence) {
  const el = document.getElementById(containerId);
  if (!el) return;

  if (!cadence || !cadence.rows || !cadence.rows.length) {
    el.innerHTML = '<div class="empty">no cadence rows</div>';
    return;
  }

  el.innerHTML = '';

  try {
    const VF    = Vex.Flow;
    const clr   = G.color;
    const rowH  = 75;
    const labelW = 90;
    const w     = el.clientWidth || 600;
    const h     = cadence.rows.length * rowH + 20;

    const renderer = new VF.Renderer(el, VF.Renderer.Backends.SVG);
    renderer.resize(w, h);
    const ctx = renderer.getContext();
    ctx.setFillStyle(clr);
    ctx.setStrokeStyle(clr);

    const winFrom = new Date(cadence.window.from).getTime();
    const winTo   = new Date(cadence.window.to).getTime();
    const winMs   = winTo - winFrom;

    cadence.rows.forEach((row, i) => {
      const y       = i * rowH + 10;
      const staveX  = labelW;
      const staveW  = w - labelW - 12;
      const stave   = new VF.Stave(staveX, y, staveW);

      if (i === 0) stave.addClef('treble');
      stave.setContext(ctx).draw();

      // Row label to the left
      const svg = el.querySelector('svg');
      if (svg) {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', 4);
        t.setAttribute('y', y + 28);
        t.setAttribute('fill', clr);
        t.setAttribute('font-size', '10');
        t.setAttribute('font-family', 'Courier New, monospace');
        t.setAttribute('opacity', '0.65');
        t.textContent = row.label;
        svg.appendChild(t);
      }

      if (!row.hits || !row.hits.length) return;

      const notes = buildCadenceNotes(VF, row.hits, winFrom, winMs);
      if (!notes.length) return;

      const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
      voice.setStrict(false);
      voice.addTickables(notes);

      new VF.Formatter().joinVoices([voice]).format([voice], staveW - 50);
      voice.draw(ctx, stave);
    });

    colorizeVF(el, clr);
  } catch(e) {
    console.warn('VexFlow cadence render:', e);
    el.innerHTML = '<div class="empty">cadence render failed</div>';
  }
}

function buildCadenceNotes(VF, hits, winFrom, winMs) {
  return hits.map(hit => {
    const dur = hit.duration_seconds;
    const ratio = dur ? (dur * 1000) / winMs : null;
    const vfDur = ratio ? ratioToVFDuration(ratio) : 'q';

    switch (hit.glyph) {
      case 'rest':
        return new VF.StaveNote({ clef: 'treble', keys: ['b/4'], duration: vfDur + 'r' });
      case 'hit':
        return new VF.StaveNote({ clef: 'treble', keys: ['b/4'], duration: 'q' });
      case 'tied':
      case 'head':
      default:
        return new VF.StaveNote({ clef: 'treble', keys: ['b/4'], duration: vfDur });
    }
  });
}

function ratioToVFDuration(r) {
  if (r >= 0.875) return 'w';   // whole  ≥ 87.5%
  if (r >= 0.4)   return 'h';   // half   ≥ 40%
  if (r >= 0.2)   return 'q';   // quarter≥ 20%
  if (r >= 0.1)   return '8';   // eighth ≥ 10%
  return '16';                   // sixteenth
}

// ── VexFlow helpers ───────────────────────────────────────────────────────────
function colorizeVF(el, clr) {
  el.querySelectorAll('path, rect, circle, line, polyline, polygon').forEach(e => {
    const fill   = e.getAttribute('fill');
    const stroke = e.getAttribute('stroke');
    if (fill   && fill   !== 'none' && fill   !== 'transparent') e.setAttribute('fill',   clr);
    if (stroke && stroke !== 'none' && stroke !== 'transparent') e.setAttribute('stroke', clr);
  });
  el.querySelectorAll('text').forEach(e => {
    if (!e.hasAttribute('fill') || e.getAttribute('fill') !== 'none') e.setAttribute('fill', clr);
  });
}

// Attempt to read rendered note X positions from the SVG
function getNotePosX(svg, count) {
  try {
    // Note heads are path elements inside groups with class 'vf-notehead' or similar
    const noteheads = svg.querySelectorAll('.vf-notehead, .vf-stavenote');
    if (noteheads.length >= count) {
      return Array.from(noteheads).slice(0, count).map(nh => {
        const box = nh.getBoundingClientRect();
        const svgBox = svg.getBoundingClientRect();
        return box.left - svgBox.left + box.width / 2;
      });
    }
  } catch(e) {}
  return Array(count).fill(null);
}

// ── HTML section renderers ────────────────────────────────────────────────────
function renderBeatTable(beats) {
  if (!beats || !beats.length) return '<div class="empty">no beats</div>';
  const rows = beats.map(b => `
<tr class="beat-row">
  <td class="beat-name">${esc(b.name)}</td>
  <td class="beat-glyph">${beatGlyph(b.state)}</td>
  <td class="beat-state ${b.state}">${esc(b.state)}</td>
  <td class="beat-time">${fmtBeatRange(b)}</td>
</tr>`).join('');
  return `<table class="beat-table">${rows}</table>`;
}

function renderPrs(prs) {
  if (!prs) return '<div class="empty">no PR data</div>';
  const all = [
    ...prs.mergeable_green.map(p => ({...p, grp:'green'})),
    ...prs.mergeable_red.map(p =>   ({...p, grp:'red'})),
    ...prs.conflicting.map(p =>     ({...p, grp:'conflict'})),
    ...prs.draft.map(p =>           ({...p, grp:'draft'})),
  ];
  if (!all.length) return '<div class="empty">no open PRs</div>';
  return all.map(p => `
<div class="pr-row">
  <span class="pr-num">#${p.number}</span>
  <span class="pr-title">${esc(p.title)}</span>
  <span class="pr-ci ${p.grp === 'green' ? 'green' : p.grp === 'red' ? 'red' : 'draft'}">${p.grp}</span>
</div>`).join('');
}

function renderFindings(findings) {
  if (!findings || !findings.length) return '<div class="empty">no findings</div>';
  return findings.map(f => `
<div class="finding-row">
  <span class="finding-sev">${esc(f.severity)}</span>
  <span class="finding-title">${esc(f.title)}</span>
  ${f.issue_number ? `<span class="finding-issue">#${f.issue_number}</span>` : ''}
</div>`).join('');
}

function renderPod(sessions) {
  if (!sessions || !sessions.length) return '<div class="empty">no tmux sessions</div>';
  return sessions.map(s => `
<div class="pod-row">
  <div class="pod-hdr">
    <span class="pod-name">${esc(s.session.name)}</span>
    <span>${fmtHealth(s.health)}</span>
    <span style="font-size:10px;opacity:.4">${s.idle_seconds}s idle</span>
  </div>
  <div class="pod-tail">${(s.tail||[]).map(esc).join('<br>')}</div>
</div>`).join('');
}

function renderCron(cron) {
  if (!cron || !cron.length) return '<div class="empty">no cron entries</div>';
  return cron.map(c => `
<div class="cron-row">
  <span class="cron-expr">${esc(c.expression)}</span>
  <span class="cron-cmd">${esc(c.command)}</span>
  <span class="cron-next">→ ${fmtTime(c.next_fire)}</span>
</div>`).join('');
}

function renderAgents(agents) {
  if (!agents || !agents.length) return '<div class="empty">no local agents</div>';
  return agents.map(a => `
<div class="agent-row">
  <span class="agent-kind">${esc(a.kind)}</span>
  <span style="font-size:8px;opacity:.7">${a.reachable ? '●' : '○'}</span>
  <span class="agent-url">${esc(a.endpoint)}</span>
  <span class="agent-lat">${a.reachable ? (a.latency_ms != null ? a.latency_ms+'ms' : 'up') : 'down'}</span>
  <span class="agent-models">${a.models.length ? '['+a.models.join(', ')+']' : ''}</span>
</div>`).join('');
}

// ── data helpers ──────────────────────────────────────────────────────────────
function findCycle(slug) {
  const [o,r] = slug.split('/');
  return ((G.state && G.state.cycles)||[]).find(c => c.repo.owner===o && c.repo.repo===r) || null;
}
function findPrs(slug) {
  const [o,r] = slug.split('/');
  return ((G.state && G.state.prs_by_repo)||[]).find(p => p.repo.owner===o && p.repo.repo===r) || null;
}
function findFindings(slug) {
  const [o,r] = slug.split('/');
  return ((G.state && G.state.findings)||[]).filter(f => f.repo.owner===o && f.repo.repo===r);
}

// ── format helpers ────────────────────────────────────────────────────────────
function beatGlyph(state) {
  return {done:'♩', running:'♪', queued:'𝄽', failed:'✕', skipped:'—'}[state] || '○';
}
function fmtBeatRange(b) {
  if (!b.started_at) return '';
  const s = fmtTime(b.started_at);
  return b.finished_at ? `${s} → ${fmtTime(b.finished_at)}` : `${s} →`;
}
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toTimeString().slice(0,5);
}
function fmtHealth(h) {
  if (!h) return '?';
  switch(h.kind) {
    case 'Working': return '◐ working';
    case 'Idle':    return '○ idle';
    case 'Crashed': return '✕ crashed';
    default:        return '? unknown';
  }
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
