[package]
name = "conductr-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-gated driven adapters implementing conductr-core port traits"

[features]
default = []
tmux        = ["dep:tokio"]
crontab     = ["dep:tokio"]
beads       = ["dep:tokio"]
notion      = ["dep:tokio", "dep:reqwest", "dep:url"]
gh-cli      = ["dep:tokio", "dep:once_cell", "dep:regex"]
mail-fs     = ["dep:tokio"]
mail-github = ["dep:tokio"]
mock        = []
ollama      = ["dep:tokio", "dep:reqwest"]
llamacpp    = ["dep:tokio", "dep:reqwest"]
local-ci    = ["dep:tokio"]
gcal        = ["dep:tokio", "dep:reqwest"]
full        = ["tmux", "crontab", "beads", "notion", "gh-cli", "mail-fs", "mail-github", "mock", "ollama", "llamacpp", "local-ci", "gcal"]

[dependencies]
conductr-core = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
async-trait   = { workspace = true }
chrono        = { workspace = true }
anyhow        = { workspace = true }

tokio     = { workspace = true, optional = true }
reqwest   = { workspace = true, optional = true }
url       = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
regex     = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
